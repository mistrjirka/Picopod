[platformio]
default_envs = heltec_wireless_stick_lite_v3

[env:heltec_wireless_stick_lite_v3]
platform = espressif32@6.3.0
framework = arduino
; Local board metadata names the actual product. It reuses Heltec's compatible
; ESP32-S3 Arduino variant while radio wiring stays explicit in src/main.cpp.
board = heltec_wireless_stick_lite_v3
monitor_speed = 115200
upload_speed = 921600
lib_ldf_mode = deep+
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
lib_deps =
    jgromes/RadioLib @ 6.6.0
