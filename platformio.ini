[platformio]
default_envs = heltec_wireless_stick_lite_v3

[env:heltec_wireless_stick_lite_v3]
platform = espressif32@6.3.0
framework = arduino
; PlatformIO has no dedicated Wireless Stick Lite V3 board definition. This
; ESP32-S3/8MB Heltec definition provides the correct MCU/flash toolchain; the
; radio wiring is declared explicitly in src/main.cpp.
board = heltec_wifi_kit_32_V3
monitor_speed = 115200
upload_speed = 921600
lib_ldf_mode = deep+
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
lib_deps =
    jgromes/RadioLib @ 6.6.0
